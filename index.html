<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS NES Emulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>JS NES Emulator</h1>
            <div class="controls">
                <input type="file" id="romFile" accept=".nes" />
                <button id="playPause">Play</button>
                <button id="reset">Reset</button>
                <button id="fullscreen">Fullscreen</button>
                <button id="toggleLogs">Toggle Logs</button>
            </div>
        </header>
        
        <main>
            <div class="emulator-screen">
                <canvas id="nesCanvas" width="256" height="240"></canvas>
                <div class="loading" id="loading">Select a ROM file to start</div>
            </div>
            
            <div class="side-panel">
                <div class="game-info">
                    <div class="rom-info">
                        <h3>ROM Information</h3>
                        <div id="romDetails">No ROM loaded</div>
                    </div>
                    
                    <div class="controls-info">
                        <h3>Controls</h3>
                        <div class="control-mapping">
                            <div class="control-row">
                                <span class="key">Arrow Keys</span>
                                <span class="action">D-Pad</span>
                            </div>
                            <div class="control-row">
                                <span class="key">X</span>
                                <span class="action">A Button</span>
                            </div>
                            <div class="control-row">
                                <span class="key">Z</span>
                                <span class="action">B Button</span>
                            </div>
                            <div class="control-row">
                                <span class="key">Enter</span>
                                <span class="action">Start</span>
                            </div>
                            <div class="control-row">
                                <span class="key">Shift</span>
                                <span class="action">Select</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="verbose-logs" id="verboseLogs">
                    <h3>Verbose Logs</h3>
                    <div class="log-controls">
                        <button id="clearLogs">Clear</button>
                        <button id="pauseLogs">Pause</button>
                        <label>
                            <input type="checkbox" id="autoScroll" checked> Auto-scroll
                        </label>
                    </div>
                    <div class="log-output" id="logOutput"></div>
                </div>
            </div>
        </main>
        
        <div class="debug-panel" id="debugPanel">
            <h3>Debug Info</h3>
            <div id="debugInfo"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsnes@0.8.0/dist/jsnes.min.js"></script>
    <script type="module" src="nes.js"></script>

</body>
</html>
